[build-system]
# setuptools>=77 is the first version that understands the PEP 639 license
# expression below (older ones reject a bare SPDX string).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veer-studio-plugin-sdk"
version = "1.2.0"
description = "Contract surface for writing Veer Studio plugins without the Veer Studio source tree"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jim Y. Li" }]
requires-python = ">=3.12"
# No License :: classifier: PEP 639's license expression replaces it, and
# current setuptools deprecates the classifier alongside the old table form.
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
    "usd-core",
]

[project.urls]
Issues = "https://github.com/veerautonomous/veer-studio-plugin-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["veer_plugin_sdk*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
# ROS Jazzy's launch_testing pytest11 hooks autoload on any workstation with
# ROS on PYTHONPATH (the common plugin-author box), crashing collection with
# ModuleNotFoundError before a single test runs.  Same block as
# atlas_studio's committed pytest.ini.
addopts = "-p no:launch_testing -p no:launch_ros"
