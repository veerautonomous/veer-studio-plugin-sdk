[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veer-studio-plugin-sdk"
version = "1.0.0"
description = "Contract surface for writing Veer Studio plugins without the Veer Studio source tree"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jim Y. Li" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
    "usd-core",
]

[project.urls]
Issues = "https://github.com/veerautonomous/veer-studio-plugin-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["veer_plugin_sdk*"]
exclude = ["tests*", "docs*"]
